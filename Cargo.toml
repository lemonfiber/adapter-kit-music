[package]
name = "adapter-kit-music"
version = "0.19.0"
edition = "2021"
rust-version = "1.95"
repository = "https://github.com/lemonfiber/adapter-kit-music"
authors = ["NightWorks.io"]
license-file = "LICENSE"
description = "music.curate as lemonfiber's music curators' adapters answer it"
publish = false

[dependencies]
adapter-kit-servarr = { git = "https://github.com/lemonfiber/adapter-kit-servarr", rev = "18e457f19d30a7a1e93e4a5f336f39c24e690a09" }
async-trait = "0.1"
lemonfiber-adapter-kit = { git = "https://github.com/lemonfiber/lemonfiber", rev = "dff24b862e753fd08c5fffde887d95379f113c18" }
lemonfiber-ports = { git = "https://github.com/lemonfiber/lemonfiber", rev = "dff24b862e753fd08c5fffde887d95379f113c18" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
lemonfiber-fixtures = { git = "https://github.com/lemonfiber/lemonfiber", rev = "dff24b862e753fd08c5fffde887d95379f113c18" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
pedantic = { level = "warn", priority = -1 }
duration_suboptimal_units = "allow"

[profile.dev]
debug = "line-tables-only"
