[package]
name = "adapter-kit-music"
version = "0.19.0"
edition = "2021"
rust-version = "1.95"
repository = "https://github.com/lemonfiber/adapter-kit-music"
authors = ["NightWorks.io"]
license-file = "LICENSE"
description = "music.curate as lemonfiber's music curators' adapters answer it"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
pedantic = { level = "warn", priority = -1 }
duration_suboptimal_units = "allow"

[profile.dev]
debug = "line-tables-only"
